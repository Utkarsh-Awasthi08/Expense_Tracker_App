spring.application.name=auth-service
server.port=9898

# Database (DB_USER / DB_PASSWORD have no default on purpose)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:authservice}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT (RS256). The public key is derived from the private key; there is no second key file.
# JWT_PRIVATE_KEY_PATH must point to a PKCS#8 PEM RSA private key. The service refuses to start without it.
jwt.issuer=${JWT_ISSUER:expense-tracker-auth}
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
jwt.refresh-ttl=${JWT_REFRESH_TTL:P30D}

management.endpoints.web.exposure.include=health

# OTP authentication settings
otp.ttl-seconds=${OTP_TTL_SECONDS:300}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
otp.rate-limit-per-hour=${OTP_RATE_LIMIT_PER_HOUR:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.default-country-code=${OTP_DEFAULT_COUNTRY_CODE:91}
# SMS_PROVIDER env var controls which provider is wired (only "fake" is supported today)

# Kafka (the producer classes are replaced by an outbox in a later stage)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.topic.name=testingselfservice
spring.kafka.topic-json.name=testingselfservice_json
spring.kafka.consumer.group-id=authservice-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.example.Serializer.UserInfoSerializer
