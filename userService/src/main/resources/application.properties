spring.application.name=userService
server.port=8888

# Database. DB_USER and DB_PASSWORD deliberately have no defaults: the service must not start without them.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:userservice}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Only the health endpoint is exposed (no env, beans, mappings...).
management.endpoints.web.exposure.include=health

# Error bodies come from the pinned error contract, never from Boot's default attributes.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Kafka. The consumer below is the legacy one; it is rewritten (DLT, create-only, contract topic/group) in Stage 4.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.topic.name=testingselfservice
spring.kafka.topic-json.name=testingselfservice_json
spring.kafka.consumer.group-id=authservice-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.expenseTracker.userService.Deserializer.UserInfoDeserializer
